<div class="container py-5 mt-2">

  <!-- Back link -->
  <a routerLink="/" class="d-flex align-items-center text-secondary text-decoration-none mb-4" style="font-size: 0.9rem;">
    <i class="fa-solid fa-arrow-left me-2"></i> Inicio
  </a>

  <h1 class="text-white fw-black mb-5" style="font-size: 2rem;">
    <i class="fa-solid fa-gear text-accent-red me-3"></i>Ajustes
  </h1>

  <!-- Toast confirmación -->
  <div class="settings-toast" [class.visible]="toastVisible">
    <i class="fa-solid fa-circle-check me-2"></i> Cambios guardados correctamente
  </div>

  <!-- Sección: Apariencia -->
  <div class="mt-card p-4 mb-4">
    <h5 class="fw-bold mb-3">
      <i class="fa-solid fa-palette text-accent-red me-2"></i>Apariencia
    </h5>
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <span class="text-white">Tema oscuro</span>
        <div class="text-secondary mt-1" style="font-size: 0.82rem;">Usa el tema oscuro en toda la aplicación</div>
      </div>
      <div class="form-check form-switch ms-3">
        <input class="form-check-input" type="checkbox" id="toggleDarkMode"
               [checked]="darkMode"
               (change)="toggleDarkMode()">
      </div>
    </div>
  </div>

  <!-- Botón guardar -->
  <button class="btn btn-accent-red w-100 fw-bold py-3 mt-2" (click)="saveSettings()">
    <i class="fa-solid fa-floppy-disk me-2"></i>Guardar cambios
  </button>

</div>
