<div class="mb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title mb-0"><i class="fa-solid fa-fire text-accent-red"></i> ÁLBUMES DESTACADOS</h2>
    <a href="#" class="link-see-all text-decoration-none">VER TODOS <i class="fa-solid fa-arrow-right"></i></a>
  </div>
  
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
    <div class="col" *ngFor="let album of featuredAlbums">
      <div class="album-card border-0 bg-transparent">
        <div class="mt-card p-0 mb-3 overflow-hidden" style="aspect-ratio: 1; border-radius: 8px;">
          <img [src]="album.image" class="w-100 h-100 object-fit-cover" [alt]="album.title">
        </div>
        <h5 class="fw-bold mb-1 text-white fs-6 text-truncate">{{ album.title }}</h5>
        <p class="mb-1 text-secondary" style="font-size: 0.85rem;">{{ album.artist }}</p>
        <div class="text-warning-custom fs-6">
          <i class="fa-solid fa-star me-1" *ngFor="let star of [1,2,3,4,5]"></i>
        </div>
      </div>
    </div>
  </div>
</div>
