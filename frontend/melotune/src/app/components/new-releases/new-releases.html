<div class="container py-5">
  <div class="mb-5 text-center">
    <h2 class="fw-bold text-white mb-2"><i class="fa-solid fa-bolt text-accent-red"></i> OUT NOW</h2>
    <p class="text-secondary">Los últimos lanzamientos musicales de este mes.</p>
  </div>

  <!-- Skeleton Loader -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" *ngIf="isLoading">
    <div class="col" *ngFor="let s of [1,2,3,4,5,6,7,8]">
      <div class="mt-card p-3 rounded-3 mb-3">
        <div class="skeleton-pulse rounded w-100 mb-3" style="aspect-ratio: 1;"></div>
        <div class="skeleton-pulse rounded mb-2" style="height: 16px; width: 80%;"></div>
        <div class="skeleton-pulse rounded mb-3" style="height: 14px; width: 60%;"></div>
        <div class="skeleton-pulse rounded" style="height: 24px; width: 40%; border-radius: 12px;"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div class="text-center py-5" *ngIf="!isLoading && albums.length === 0">
    <p class="text-secondary">No hay lanzamientos este mes todavía.</p>
  </div>

  <!-- Álbumes Grid -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" *ngIf="!isLoading && albums.length > 0">
    <div class="col" *ngFor="let album of albums">
      <a [routerLink]="['/album', album.artist, album.name]" class="text-decoration-none">
        <div class="mt-card nr-card p-3 rounded-4 h-100">
          <div class="position-relative overflow-hidden rounded-3 mb-3" style="aspect-ratio: 1;">
            <img [src]="album.image || 'https://placehold.co/600x600/222436/60658a?text=No+Image'"
                 class="w-100 h-100 object-fit-cover transition-transform" 
                 [alt]="album.name"
                 (error)="album.image = 'https://placehold.co/600x600/222436/60658a?text=No+Cover'">
          </div>
          <h5 class="fw-bold mb-1 text-white fs-6 text-truncate">{{ album.name }}</h5>
          <p class="mb-3 text-secondary text-truncate" style="font-size: 0.85rem;">{{ album.artist }}</p>
          <span class="badge bg-accent-red">{{ album.release_date }}</span>
        </div>
      </a>
    </div>
  </div>
</div>
