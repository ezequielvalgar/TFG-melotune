version: '3.8'

services:

  # ─── Base de Datos ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: melotune_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - melotune_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 5

  # ─── Backend Laravel + PHP-FPM ────────────────────────────────────────────
  backend:
    build:
      context: ./backend/melotune
      dockerfile: Dockerfile.prod
    container_name: melotune_backend_prod
    restart: always
    volumes:
      - storage_data:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      LASTFM_SHARED_SECRET: ${LASTFM_SHARED_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.mailersend.net
      MAIL_PORT: 587
      MAIL_USERNAME: MS_NdOAHo@test-r6ke4n1q0wygon12.mlsender.net
      MAIL_PASSWORD: mssp.7EWRMa4.pq3enl6m5r0g2vwr.Lsv05pW
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: MS_NdOAHo@test-r6ke4n1q0wygon12.mlsender.net
      MAIL_FROM_NAME: MeloTune
    depends_on:
      db:
        condition: service_healthy
    networks:
      - melotune_net

  # ─── Nginx para Backend ───────────────────────────────────────────────────
  nginx_backend:
    image: nginx:alpine
    container_name: melotune_nginx_backend
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./backend/melotune:/var/www/html
      - ./backend/melotune/nginx.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage
    depends_on:
      - backend
    networks:
      - melotune_net

  # ─── Frontend Angular compilado con Nginx ────────────────────────────────
  frontend:
    build:
      context: ./frontend/melotune
      dockerfile: Dockerfile.prod
    container_name: melotune_frontend_prod
    restart: always
    ports:
      - "80:80"
    networks:
      - melotune_net

networks:
  melotune_net:
    driver: bridge

volumes:
  db_data_prod:
  storage_data:
